name: Build Tweak

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || echo "Homebrew ya instalado"

      - name: Install ldid
        run: |
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Build Tweak
        run: |
          cd $GITHUB_WORKSPACE
          make package
        env:
          THEOS: $HOME/theos

      # Subir el dylib como artifact
      - name: Upload dylib
        uses: actions/upload-artifact@v3
        with:
          name: MKFEKBKJCKEHook-dylib
          path: .theos/obj/debug/MKFEKBKJCKEHook.dylib

      # Subir el deb (opcional)
      - name: Upload deb
        uses: actions/upload-artifact@v3
        with:
          name: MKFEKBKJCKEHook-deb
          path: packages/*.deb
