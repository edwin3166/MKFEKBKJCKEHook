name: Build Tweak

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Install Toolchain
        run: |
          echo "Skipping iphoneos-deploy.pkg installation, not needed on GitHub Actions"

      - name: Build Tweak
        run: |
          cd $GITHUB_WORKSPACE
          make package
        env:
          THEOS: $HOME/theos
