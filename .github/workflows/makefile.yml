name: Build MKFEKBKJCKEHook

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: $HOME/theos
      PATH: $PATH:$HOME/theos/bin  # <- Asegúrate de no sobrescribir PATH

    steps:
    - name: Verify system tools
      run: |
        echo "Checking essential commands..."
        which tar
        tar --version
        which git
        git --version
        which make
        make --version

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Homebrew (if missing)
      run: |
        if ! command -v brew &>/dev/null; then
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> $HOME/.bash_profile
          eval "$(/opt/homebrew/bin/brew shellenv)"
        fi

    - name: Install ldid
      run: brew install ldid

    - name: Install Theos
      run: |
        if [ ! -d "$HOME/theos" ]; then
          git clone --branch master https://github.com/theos/theos.git $HOME/theos
        fi

    - name: Build tweak
      run: |
        cd $GITHUB_WORKSPACE
        make clean
        make

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: MKFEKBKJCKEHook.dylib
        path: $GITHUB_WORKSPACE/.theos/obj/debug/arm64/*.dylib
