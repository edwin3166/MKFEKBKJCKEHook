name: Build MKFEKBKJCKEHook

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Xcode Command Line Tools
        run: |
          if ! xcode-select -p &>/dev/null; then
            sudo xcode-select --install
          fi

      - name: Install essential tools
        run: |
          brew update
          brew install make git ldid curl

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          if [ ! -d "$THEOS" ]; then
            git clone --branch master https://github.com/theos/theos.git $THEOS
          fi

      - name: Build dylib
        run: |
          export THEOS=$THEOS
          cd $GITHUB_WORKSPACE
          make clean
          make

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKFEKBKJCKEHook
          path: $GITHUB_WORKSPACE/.theos/obj/debug/arm64/*.dylib
