name: Build MKFEKBKJCKEHook

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: $HOME/theos
      PATH: /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/theos/bin

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Install Homebrew and ldid
      run: |
        # Instalar Homebrew si falta
        if ! command -v brew &>/dev/null; then
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi

        # Agregar Homebrew al PATH en la sesión actual
        if [ -d "/opt/homebrew/bin" ]; then
          eval "$(/opt/homebrew/bin/brew shellenv)"
        elif [ -d "/usr/local/bin" ]; then
          eval "$(/usr/local/bin/brew shellenv)"
        fi

        # Verificar que brew funciona
        brew --version

        # Instalar ldid
        brew install ldid

    - name: Install Theos
      run: |
        if [ ! -d "$HOME/theos" ]; then
          git clone --branch master https://github.com/theos/theos.git $HOME/theos
        fi
        $HOME/theos/bin/update-theos

    - name: Build tweak
      run: |
        cd $GITHUB_WORKSPACE
        make clean
        make

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: MKFEKBKJCKEHook.dylib
        path: $GITHUB_WORKSPACE/.theos/obj/debug/arm64/*.dylib
