name: Build MKFEKBKJCKEHook

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: $HOME/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          # Instalar ldid para firmar dylibs
          brew install ldid || true
          # Crear carpeta THEOS si no existe
          mkdir -p $THEOS
          # Clonar Theos si no está
          if [ ! -d "$THEOS" ]; then
            git clone --branch master https://github.com/theos/theos.git $THEOS
          fi

      - name: Build tweak
        working-directory: ${{ github.workspace }}
        run: |
          export THEOS=$THEOS
          make clean
          make

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKFEKBKJCKEHook-dylib
          path: "$GITHUB_WORKSPACE/.theos/obj/debug/arm64/*.dylib"
