name: Build MKFEKBKJCKEHook

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install essential tools
        run: |
          # Instalar brew si no existe
          if ! command -v brew &> /dev/null; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo 'PATH=/opt/homebrew/bin:$PATH' >> $GITHUB_ENV
          brew update
          brew install ldid git curl

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          if [ ! -d "$THEOS" ]; then
            git clone --branch master https://github.com/theos/theos.git $THEOS
          fi

      - name: Build dylib
        run: |
          export THEOS=$THEOS
          cd $GITHUB_WORKSPACE
          make clean
          make

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKFEKBKJCKEHook
          path: $GITHUB_WORKSPACE/.theos/obj/debug/arm64/*.dylib
