name: Build MKFEKBKJCKEHook

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Install Homebrew and ldid
      run: |
        # Instalar Homebrew si no existe
        if ! command -v brew &>/dev/null; then
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi

        # Agregar Homebrew al PATH
        eval "$(/opt/homebrew/bin/brew shellenv || true)"
        eval "$(/usr/local/bin/brew shellenv || true)"

        # Instalar ldid si no existe
        if ! command -v ldid &>/dev/null; then
          brew install ldid
        fi

    - name: Install Theos
      run: |
        if [ ! -d "$THEOS" ]; then
          git clone --branch master https://github.com/theos/theos.git $THEOS
        fi
        $THEOS/bin/update-theos

    - name: Build tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$PATH:/opt/homebrew/bin:/usr/local/bin   # <- Aseguramos que ldid esté disponible
        cd $GITHUB_WORKSPACE
        make clean
        make

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: MKFEKBKJCKEHook.dylib
        path: $GITHUB_WORKSPACE/.theos/obj/debug/arm64/*.dylib
