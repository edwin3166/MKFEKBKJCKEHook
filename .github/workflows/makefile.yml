name: Build iOS Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Homebrew tools
        run: |
          brew update
          brew install make git ldid

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Update Theos (IMPORTANT)
        run: |
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos

      - name: Build tweak
        run: |
          export THEOS=$THEOS
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: tweak-dylib
          path: .theos/obj/debug/arm64/*.dylib
