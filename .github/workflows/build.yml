name: Build Tweak

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Install Toolchain
        run: |
          sudo installer -pkg $(xcrun --find iphoneos-deploy.pkg) -target /

      # 🚫 Bootstrap step eliminado
      # - name: Bootstrap
      #   run: bin/bootstrap.pl

      - name: Build Tweak
        run: make package
        env:
          THEOS: $HOME/theos
