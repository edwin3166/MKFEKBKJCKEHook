name: Build Free Fire AimKill Tweak

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # -------------------------------
    # 1️⃣ Checkout repository
    # -------------------------------
    - name: Checkout repository
      uses: actions/checkout@v3

    # -------------------------------
    # 2️⃣ Instalar Git (si no existe)
    # -------------------------------
    - name: Install Git
      run: |
        git --version || brew install git

    # -------------------------------
    # 3️⃣ Instalar Perl completo
    # -------------------------------
    - name: Install Perl
      run: |
        perl -v || brew install perl
        export PATH="/usr/local/opt/perl/bin:$PATH"
        echo 'PATH="/usr/local/opt/perl/bin:$PATH"' >> $GITHUB_ENV

    # -------------------------------
    # 4️⃣ Descargar ldid precompilado
    # -------------------------------
    - name: Download ldid
      run: |
        curl -L -o ldid.zip https://github.com/ProcursusTeam/ldid/releases/download/2.1.2/ldid-macos.zip
        unzip ldid.zip -d $HOME/ldid
        chmod +x $HOME/ldid/ldid
        echo "$HOME/ldid" >> $GITHUB_PATH

    # -------------------------------
    # 5️⃣ Instalar Theos y bootstrap
    # -------------------------------
    - name: Install Theos
      run: |
        git clone --branch master https://github.com/theos/theos.git $HOME/theos
        export THEOS=$HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        $THEOS/bin/bootstrap.sh
        sudo xcode-select -s /Applications/Xcode_16.4.app

    # -------------------------------
    # 6️⃣ Verificar Theos
    # -------------------------------
    - name: Verify Theos
      run: |
        echo "THEOS is at $THEOS"
        ls $THEOS

    # -------------------------------
    # 7️⃣ Compilar Tweak
    # -------------------------------
    - name: Build Tweak
      env:
        THEOS: ${{ env.THEOS }}
      run: |
        cd $GITHUB_WORKSPACE
        make clean
        make package

    # -------------------------------
    # 8️⃣ Subir dylib
    # -------------------------------
    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: MKFEKBKJCKEHook-dylib
        path: $GITHUB_WORKSPACE/.theos/obj/debug/*.dylib
