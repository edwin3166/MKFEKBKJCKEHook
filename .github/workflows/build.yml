name: Build Free Fire AimKill Tweak

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # -------------------------------
    # 1️⃣ Checkout del repositorio
    # -------------------------------
    - name: Checkout repository
      uses: actions/checkout@v3

    # -------------------------------
    # 2️⃣ Instalar Homebrew y ldid
    # -------------------------------
    - name: Install Homebrew & ldid
      run: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        # Agregar Homebrew al PATH
        echo "/opt/homebrew/bin" >> $GITHUB_PATH
        brew install ldid

    # -------------------------------
    # 3️⃣ Instalar Git y Perl
    # -------------------------------
    - name: Install Git & Perl
      run: |
        git --version || brew install git
        perl -v || brew install perl
        echo "/usr/local/opt/perl/bin" >> $GITHUB_PATH

    # -------------------------------
    # 4️⃣ Instalar Theos (moderno, sin bootstrap)
    # -------------------------------
    - name: Install Theos
      run: |
        git clone --branch master https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        sudo xcode-select -s /Applications/Xcode_16.4.app

    # -------------------------------
    # 5️⃣ Verificar Theos
    # -------------------------------
    - name: Verify Theos
      run: |
        echo "THEOS is at $THEOS"
        ls $THEOS

    # -------------------------------
    # 6️⃣ Compilar el Tweak
    # -------------------------------
    - name: Build Tweak
      env:
        THEOS: ${{ env.THEOS }}
      run: |
        cd $GITHUB_WORKSPACE
        make clean
        make package

    # -------------------------------
    # 7️⃣ Subir dylib como artifact
    # -------------------------------
    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: MKFEKBKJCKEHook-dylib
        path: $GITHUB_WORKSPACE/.theos/obj/debug/*.dylib
