name: Build Free Fire AimKill Tweak

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Theos
      run: |
        echo "Instalando Theos..."
        git clone --branch master https://github.com/theos/theos.git $HOME/theos
        export THEOS=$HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        sudo xcode-select -s /Applications/Xcode_16.4.app

    - name: Install ldid
      run: |
        brew install ldid

    - name: Verify Theos
      run: |
        echo "THEOS is at $THEOS"
        ls $THEOS

    - name: Build Tweak
      env:
        THEOS: ${{ env.THEOS }}
      run: |
        cd $GITHUB_WORKSPACE
        make clean
        make package

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: MKFEKBKJCKEHook-dylib
        path: $GITHUB_WORKSPACE/.theos/obj/debug/*.dylib
